<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f1f3d;
    overflow: hidden;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #0f1f3d;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 70px 90px;
    overflow: hidden;
  }
  /* Background orbs */
  .orb1 {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
  }
  .orb2 {
    position: absolute;
    bottom: -100px;
    left: -80px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
  }
  /* Gold accent line left */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, #c9a84c, #e8c97a, #c9a84c);
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #c9a84c, #e8c97a);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #0f1f3d;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .logo-text {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .logo-text span { color: #c9a84c; }
  .tagline-small {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }
  h1 {
    font-size: 68px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -1.5px;
    margin-bottom: 24px;
  }
  h1 em {
    color: #c9a84c;
    font-style: normal;
  }
  .sub {
    font-size: 22px;
    color: rgba(255,255,255,0.6);
    line-height: 1.5;
    max-width: 700px;
    margin-bottom: 44px;
  }
  .pills {
    display: flex;
    gap: 12px;
  }
  .pill {
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 100px;
    padding: 10px 22px;
    font-size: 15px;
    color: #e8c97a;
    font-weight: 500;
  }
  .url {
    position: absolute;
    bottom: 40px;
    right: 90px;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
  }
  .url span { color: #c9a84c; }
</style>
</head>
<body>
<div class="card">
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="accent-line"></div>

  <div class="logo-row">
    <div class="logo-icon">M</div>
    <div>
      <div class="logo-text">Many<span>Handz</span></div>
      <div class="tagline-small">One AI. Many hands.</div>
    </div>
  </div>

  <h1>Your business,<br>with an extra <em>set of hands.</em></h1>

  <p class="sub">AI that answers your calls and website chat — powered by one knowledge base that knows your business.</p>

  <div class="pills">
    <div class="pill">📞 Voice</div>
    <div class="pill">💬 Chat Widget</div>
    <div class="pill">🧠 Knowledge Base</div>
    <div class="pill">🇦🇺 Built in Perth</div>
  </div>

  <div class="url"><span>manyhandz</span>.ai</div>
</div>
</body>
</html>
